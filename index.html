<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelas X-16 - 2025/2026</title>
    
    <!-- INLINE CSS - PASTI JALAN! -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            line-height: 1.6; 
            color: #333; 
            overflow-x: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; }
        
        /* HERO */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url('./images/foto-kelas.jpg') center/cover;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
        }
        .hero-overlay {
            background: rgba(0,0,0,0.4); padding: 3rem; 
            border-radius: 30px; backdrop-filter: blur(10px);
        }
        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem); font-weight: 700;
            color: white; margin-bottom: 1rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        /* GURU */
        .guru-section { padding: 8rem 0; background: #f8f9ff; }
        .section-title {
            font-size: 3rem; text-align: center; margin-bottom: 4rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .guru-card {
            display: grid; grid-template-columns: 1fr 1fr; 
            gap: 4rem; align-items: center; max-width: 1000px; margin: 0 auto;
        }
        .guru-photo img {
            width: 100%; height: 400px; object-fit: cover;
            border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        
        /* SISWA */
        .siswa-section { padding: 8rem 0; }
        .siswa-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .siswa-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); transition: all 0.4s ease;
            cursor: pointer;
        }
        .siswa-card:hover {
            transform: translateY(-15px); box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }
        .siswa-photo { width: 100%; height: 280px; object-fit: cover; }
        .siswa-name { font-size: 1.3rem; font-weight: 700; color: #333; padding: 1rem; }
        
        /* MOMEN SLIDER */
        .momen-section { padding: 8rem 0; background: #f8f9ff; }
        .slider-container { max-width: 1000px; margin: 0 auto; position: relative; }
        .slider { overflow: hidden; border-radius: 25px; box-shadow: 0 30px 80px rgba(0,0,0,0.2); }
        .slide { display: none; }
        .slide.active { display: block; }
        .slide img { width: 100%; height: 500px; object-fit: cover; }
        .slider-nav { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; }
        .nav-btn {
            background: linear-gradient(45deg, #667eea, #764ba2); color: white;
            border: none; width: 60px; height: 60px; border-radius: 50%;
            cursor: pointer;
        }
        .slider-dots { display: flex; justify-content: center; gap: 0.5rem; margin-top: 2rem; }
        .dot {
            width: 15px; height: 15px; border-radius: 50%;
            background: #ddd; cursor: pointer;
        }
        .dot.active { background: #667eea; transform: scale(1.3); }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .guru-card { grid-template-columns: 1fr; text-align: center; }
            .siswa-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
        }
    </style>
    
    <!-- FONTS - TETEP PAKAI -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Hero Section dengan Background Foto Kelas -->
    <section class="hero">
        <div class="hero-overlay">
            <div class="hero-content">
                <h1 class="hero-title">Kelas X-16</h1>
                <p class="hero-subtitle">Tahun Ajaran 2025/2026</p>
                <div class="hero-stats">
                    <div><span>30</span> Siswa</div>
                    <div><span>1</span> Wali Kelas</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Guru/Wali Kelas Section -->
    <section class="guru-section">
        <div class="container">
            <h2 class="section-title">👨‍🏫 Wali Kelas</h2>
            <div class="guru-card">
                <div class="guru-photo">
                    <img src="https://via.placeholder.com/400x400/667eea/FFFFFF?text=Guru" alt="Wali Kelas">
                </div>
                <div class="guru-info">
                    <h3>Bapak <strong>Abdul Wahab Amirullah S.Pd</strong></h3>
                    <p>Mata Pelajaran: Bahasa Indonesia </p>
                    <div class="guru-motto">
                        "Belajar adalah kunci sukses masa depan!"
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Siswa Section -->
    <section class="siswa-section">
        <div class="container">
            <h2 class="section-title">👥 Anggota Kelas</h2>
            <div class="siswa-grid" id="siswaGrid">
                <!-- Siswa loaded via JS -->
            </div>
        </div>
    </section>

    <!-- Momen Section dengan Slider -->
    <section class="momen-section">
        <div class="container">
            <h2 class="section-title">📸 Moment</h2>
            <div class="slider-container">
                <div class="slider" id="momenSlider">
                    <!-- Slides loaded via JS -->
                </div>
                <div class="slider-nav">
                    <button class="nav-btn prev" onclick="changeSlide(-1)"><i class="fas fa-chevron-left"></i></button>
                    <button class="nav-btn next" onclick="changeSlide(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="slider-dots" id="sliderDots"></div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
